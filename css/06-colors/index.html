<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colors in CSS</title>

    <style>
      h1 {
        /* color: blueviolet; */
        color: #ad9786; /* rrggbb */
      }

      h2 {
        /* 
        rgb values : 0-255 => total 256 values
        alpha : 0 - 1
         */
        color: rgba(29, 58, 185, 0.302);
      }
      
      h3{
        background-color: rgba(244, 233, 86, 0.9);
      }
    </style>
  </head>
  <body>
    <h1>This is Heading h1 Tag</h1>

    <h2>This is Heading h2 Tag</h2>

    <h3>This is Heading h3 Tag</h3>
  </body>
</html>
