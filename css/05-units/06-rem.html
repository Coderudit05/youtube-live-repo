<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rem-unit in css</title>
    <style>
      html {
        font-size: 200px;
      }
      div {
        font-size: 20px;
        height: 2rem;
        width: 2rem;
        background-color: blueviolet;
      }
    </style>
  </head>
  <body>
    <!-- root element => html tag is the root element -->
    <!-- rem => Relative to root element's current font size -->
    <div></div>
  </body>
</html>
