<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>active</title>

    <style>

        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background-color: black;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
        
        button{
            background-color: purple;
            color: white;

            font-size: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:active{
            background-color: red;
        }
    </style>
  </head>
  <body>
    <button>Click Me</button>

  </body>
</html>
