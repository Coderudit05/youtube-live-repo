<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .parent {
        height: 400px;
        width: 600px;
        background-color: peru;

        position: relative;
      }

      .child {
        height: 200px;
        width: 200px;
        background-color: yellowgreen;

        position: absolute;
        bottom: 0;
        right: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child"></div>
    </div>
  </body>
</html>
