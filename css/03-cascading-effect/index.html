<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascading Effect in CSS</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      h1 {
        font-size: 60px;
      }

      h2 {
        color: blueviolet;
      }
    </style>

    <!-- cascading effect -->
  </head>
  <body>
    <h1 style="color: blueviolet; background-color: aquamarine">
      Hello how are you
    </h1>

    <h2 style="color: pink;">Hello this is h2</h2>
  </body>
</html>
