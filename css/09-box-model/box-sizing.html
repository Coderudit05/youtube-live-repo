<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Sizing</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .box {
        height: 200px;
        width: 200px;
        background-color: purple;

        border: 10px solid black;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">Hehehe</div>
  </body>
</html>
