<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>group selector</title>

    <style>
        h1{
            color: brown;
        }
        h2{
            color: brown;
        }
        h3{
            color: brown;
        }
        h4{
            color: brown;
        }
        p{
            color: brown;
        }
        div{
            color: brown;
        }
        span{
            color: brown;
        }

        section{
            color: brown;
        }

        h1,h2,h3,h4,p,div,span,section{
           color: blueviolet;
        }
    </style>
</head>
<body>

    <h1>h1</h1>
    <h2>h2</h2>
    <h3>h3</h3>
    <h4>h4</h4>
    <p>paragraph</p>
    <div>div</div>
    <span>span </span>
    <section>section</section>
    
</body>
</html>
