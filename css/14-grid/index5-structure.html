<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=\, initial-scale=1.0" />
    <title>Structure</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      .parent {
        height: 100vh;
        background-color: gray;

        display: grid;

        grid-template-rows: 1fr 2fr 2fr 1fr;
        grid-template-columns: 1fr 1fr 1fr;
      }

      .box{
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
      }

      .child1{
        background-color: peru;
        /* grid-column-start: 1;
        grid-column-end: 4; */
        grid-column: 1/4;
      }


      .child2{
        background-color: purple;
        grid-row: 2/4;

      }
      .child3{
        background-color: orange;

        grid-column: 2/4;
        
      }

      .child4{
        background-color: blueviolet;
      }
      .child5{
        background-color: brown;
      }
      
      .child6{
        grid-column: 1/4;
        background-color: palevioletred;
      }

    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box child1">Header</div>
      <div class="box child2">Sidebar</div>
      <div class="box child3">Content1</div>
      <div class="box child4">Content2</div>
      <div class="box child5">Content3</div>
      <div class="box child6">Footer</div>
    </div>
  </body>
</html>
