<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borders</title>

    <style>
      .box1 {
        height: 200px;
        width: 200px;
        border: 10px solid blueviolet;
        border-radius: 2000px;
      }
      .box2 {
        height: 200px;
        width: 200px;
        border: 10px dashed red;
        border-radius: 50%;
      }
      .box3 {
        height: 200px;
        width: 200px;
        border: 10px dotted purple;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="box1">This is Box</div>
    <div class="box2">This is Box</div>
    <div class="box3">This is Box</div>
  </body>
</html>
