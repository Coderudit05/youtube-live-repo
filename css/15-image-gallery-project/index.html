<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery Project</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/f12c1313f0.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <nav>
        <div id="logo">
          <i class="fa-brands fa-artstation"></i>
          <h2>Gallery</h2>
        </div>

        <ul id="navLinks">
          <li><a href="#">Home</a></li>
          <li><a href="#">Explore</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#" id="contactLink">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section id="hero">
      <h2>A Little Inspiration</h2>
      <h1>
        Beautiful Place <br />
        Endless Inspiration
      </h1>
      <p>Explore a collection of moments from around the world</p>
      <div id="heroButtons">
        <button id="firstBtn">All</button>
        <button>Nature</button>
        <button>Travel</button>
        <button>Architecture</button>
      </div>
    </section>

    <section id="gallerySection">
      <div class="img firstImg">first</div>
      <div class="img secondImg">second</div>
      <div class="img thirdImg">third</div>
      <div class="img fourthImg">fourth</div>
      <div class="img fifthImg">fifth</div>
      <div class="img sixthImg">sixth</div>
      <div class="img seventhImg">seventh</div>
      <div class="img eighthImg">eighth</div>
      <div class="img ninthImg">ningth</div>
    </section>
  </body>
</html>
