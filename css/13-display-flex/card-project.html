<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Project</title>
    <link rel="stylesheet" href="card-project.css" />
    <script
      src="https://kit.fontawesome.com/f12c1313f0.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="parent">
      <div id="card">
        <div id="img-box">
          <img
            src="https://images.unsplash.com/photo-1531891570158-e71b35a485bc?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt=""
          />
        </div>

        <div id="status">
          <h2>Casual Hoodie</h2>
          <h3>$45.00</h3>

          <div id="rating">
            <div id="stars">
              <img src="./assets/star.png" alt="" />
              <img src="./assets/star.png" alt="" />
              <img src="./assets/star.png" alt="" />
              <img src="./assets/star.png" alt="" />
              <img src="./assets/rating.png" alt="" />
            </div>

            <div id="rating-count">(328)</div>
          </div>
        </div>

        <div id="highlight">Best Seller</div>
        <button id="favourate"><i class="fa-regular fa-heart"></i></button>
      </div>
    </div>
  </body>
</html>
