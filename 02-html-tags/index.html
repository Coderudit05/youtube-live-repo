<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>H1 is used for main heading</h1>
    <h2>H2 is used basically for the subheading</h2>
    <h3>Hello this is h3</h3>

What is Tag : The HTML Tags are the containers which helps us to store some data like heading, subheading, img,videos,text,etc..

Tags have two types : Self Closing and Container Tag
