<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block vs Inline Elements</title>
  </head>
  <body>
    <!-- block elements -> ye wo elements hain jo full width occupy krte hain means ye apne side mai kise aur element ko allow nhe karte hain -->
    <!-- inline elements -> ye wo elements hain jo full width occupy nahe krte hain means jitne bhi width required hoge ye utne he lete hain -->
    <h1>Hello how are you</h1>
    <h1>Hello how are you again</h1>

    <div>this is div</div>
    <p>this is paragraph</p>
    <p>this is paragraph</p>

    <h2>this is h3</h2>
    <footer>this is footer</footer>
    <footer>this is footer</footer>

    <a href="">this is a tag</a>
    <a href="">this is a tag</a>


    <h1>Hello this is heading <span>this is inline</span></h1>
    <span>hello this is span <h1>hello this is heading inside the span</h1></span>
  </body>
</html>
